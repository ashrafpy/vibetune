[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibetune"
version = "0.1.0"
description = "Retro Terminal Spotify Connect Remote Player (TUI)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "spotipy>=2.24.0",
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
vibetune = "vibetune.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vibetune"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
